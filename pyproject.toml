[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review-agent"
version = "0.1.0"
description = "Local LLM-based contract policy review agent"
requires-python = ">=3.11"

dependencies = [
    "openai",
    "pydantic>=2",
]

[project.scripts]
contract-review = "contract_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
